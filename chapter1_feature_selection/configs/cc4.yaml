# configs/cc4.yaml
data:
  raw_json_path: "data/raw/cc4_export.jsonl"
  windows_path: "data/windows.parquet"
  window_size_sec: 300
  window_step_sec: 60
  timestamp_key: "timestamp"
  agent_id_key: "agent_id"
  event_type_key: "event_type"
  label_key: "is_attack"
  attack_stage_key: "attack_stage"
  early_warning_horizon_sec: 3600
  label_mode: "in_window"

features:
  numeric_fields: ["severity", "risk_proxy", "risk", "reward", "done_flag", "t_step"]
  categorical_fields: ["region_id", "src", "dst", "zone", "action", "target_host", "success"]
  text_fields: ["event_desc"]
  hash_dim_cat: 256
  hash_dim_text: 256

clfs:
  batch_size: 256
  epochs: 10
  lr: 0.001
  temperature: 0.2
  embed_dim: 128
  proj_dim: 64
  device: "cpu"

candidate_pool:
  top_ratio: 0.3
  sensitivity_max_windows: 5000
  min_fields: 3
  max_candidate_dim: 384
  score_norm: "sqrt_dim"
  min_raw_score_ratio: 0.0

detector:
  model: "logreg"
  threshold: 0.5
  class_weight: null
  C: 1.0
  max_iter: 1000

prfs:
  k_flip: 64
  tau_soft_update: 1.0
  ppo_epochs: 10
  rollout_len: 512
  iters: 20
  gamma: 0.99
  gae_lambda: 0.95
  clip_eps: 0.2
  actor_lr: 0.0003
  critic_lr: 0.001
  val_ratio: 0.15

reward:
  lambda_sparse: 4.0
  target_keep_ratio: 0.45
  lambda_fp: 1.0
  lambda_lag: 0.5
  hour_window_sec: 3600