# Formal v2.1 shared comparison contract for LWM-RL / UG-CEM-APT / CEM-APT
# Gate A freezes the shared domain/model interface here.
# Planner-specific tuned parameters are frozen later without changing these shared fields.

config:
  name: compare_ug_cem_formal_v2_1
  version: "2.1"
  status: formal_gate_a
  source_of_truth: docs/FINAL_PAPER_EXPERIMENT_ALIGNMENT.md
  historical_plan: docs/UG_CEM_APT_REPRODUCTION_PLAN.md

environment:
  platform: cyborg_cc4
  episode_steps: 500
  pad_spaces: false
  decision_epoch: true
  blue_agents:
    - blue_agent_0
    - blue_agent_1
    - blue_agent_2
    - blue_agent_3
    - blue_agent_4

state:
  encoder: shared.formal_state.FormalStateEncoder
  dim: 27
  availability_feature: any_valid_observable_target
  availability_index: 17
  planner_visible_only: true
  hidden_red_truth: false

action_space:
  categorical: true
  n_actions: 4
  actions:
    - id: 0
      name: no_op
      cyborg_action: Sleep
      duration_ticks: 1
    - id: 1
      name: analyse
      cyborg_action: Analyse
      duration_ticks: 2
    - id: 2
      name: remove
      cyborg_action: Remove
      duration_ticks: 3
    - id: 3
      name: restore
      cyborg_action: Restore
      duration_ticks: 5
  fallback_on_no_valid_observable_target: Sleep
  record_requested_and_executed: true
  model_space_canonicalizer: shared.model_space_action.canonicalize_requested_action

planning_contract:
  horizon: 4
  gamma_tick: 0.99
  execute_first_action_only: true
  replan_each_decision_epoch: true
  duration_aware_discount: true

artifacts:
  train_replay: outputs/formal_replay_final_20260917/train.jsonl
  validation_replay: outputs/formal_replay_final_20260917/validation.jsonl
  selected_world_model: outputs/world_model_final_20260917/a4_5b/world_model_absolute.pt
  response_reward_predictor: outputs/world_model_final_20260917/a4_5c/response_reward_predictor.pt
  action_consistency_report: outputs/world_model_final_20260917/a4_6a/action_consistency_report.json
  b0_1_report: outputs/world_model_final_20260917/b0_1/per_action_audit.json
  artifact_manifest: docs/FINAL_REWARD_MODEL_MANIFEST.json

world_model:
  state_dim: 27
  n_actions: 4
  ensemble_size: 5
  hidden_dim: 128
  target_mode: absolute
  probabilistic_output: diagonal_gaussian
  bootstrap_per_member: true
  independent_member_optimizer: true
  train_only_state_normalizer: true
  fixed_member_through_horizon: true
  deterministic_mean_rollout: true
  aleatoric_resampling: false

response_objective:
  reward_protocol: final_paper_20260917_v1
  lambda_time: 1.0
  lambda_failure: 1.0
  delay_term: sum_active_incident_compromise_age
  failure_scope: all_tracked_host_local_work_failures
  attack_eradication_time: true
  incident_host_lwf_only: false
  official_team_reward_separate: true

response_reward_predictor:
  input_state_dim: 27
  action_dim: 4
  next_state_dim: 27
  hidden_dim: 128
  gamma_tick: 0.99
  train_completed_transitions_only: true
  hidden_reward_inputs: false

seed_protocol:
  train: [1000, 1001, 1002, 1003, 1004, 1005, 1006, 1007, 1008, 1009, 1010, 1011, 1012, 1013, 1014, 1015, 1016, 1017, 1018, 1019, 1020, 1021, 1022, 1023, 1024, 1025, 1026, 1027, 1028, 1029, 1030, 1031]
  validation: [2000, 2001, 2002, 2003, 2004, 2005, 2006, 2007]
  calibration: [3000, 3001, 3002, 3003, 3004, 3005, 3006, 3007]
  test: [4000, 4001, 4002, 4003, 4004, 4005, 4006, 4007, 4008, 4009, 4010, 4011, 4012, 4013, 4014, 4015, 4016, 4017, 4018, 4019, 4020, 4021, 4022, 4023, 4024, 4025, 4026, 4027, 4028, 4029, 4030, 4031, 4032, 4033, 4034, 4035, 4036, 4037, 4038, 4039, 4040, 4041, 4042, 4043, 4044, 4045, 4046, 4047, 4048, 4049, 4050, 4051, 4052, 4053, 4054, 4055, 4056, 4057, 4058, 4059, 4060, 4061, 4062, 4063, 4064, 4065, 4066, 4067, 4068, 4069, 4070, 4071, 4072, 4073, 4074, 4075, 4076, 4077, 4078, 4079, 4080, 4081, 4082, 4083, 4084, 4085, 4086, 4087, 4088, 4089, 4090, 4091, 4092, 4093, 4094, 4095, 4096, 4097, 4098, 4099]

final_paper_evaluation:
  episodes_per_repeat: 100
  timesteps_per_episode: 500
  independent_training_repeats: 5
  aggregation: mean_plus_minus_sample_std_across_training_repeats
  metrics:
    - cc4_official_reward
    - operation_failure_penalty
    - recovery_precision
    - recovery_time
  table_1_methods: [UAMCTS, RSMBRL, CARL, DCA, PriorRL, TERLA, LWM-RL]
  table_2_ablations: [RL-Only, LLM-RL, WM-RL, LWM-RL]
  table_3_reward_ablations: [Delay-Only, Fail-Only, Full-Reward]

fairness:
  methods:
    - lwm_rl
    - ug_cem_apt
    - cem_apt
  shared_state_encoder: true
  shared_action_contract: true
  shared_target_resolver: true
  shared_cyborg_action_adapter: true
  shared_world_model_checkpoint: true
  shared_response_reward_predictor: true
  shared_seed_protocol: true
  shared_decision_epoch_semantics: true
  calibration_test_update_forbidden: true

gate_a:
  a4_6a_closed: true
  a4_6b_closed: true
  a4_6c_closed: true
  a4_closed: true
  a5_closed: true
  gate_a_closed: true
  selected_world_model_target_mode: absolute
  formal_state_dim: 27
  formal_n_actions: 4
  formal_horizon: 4

legacy_isolation:
  legacy_development_config: configs/compare_ug_cem_local_online.yaml
  legacy_config_allowed_for_formal_runs: false
  old_replay_allowed_for_formal_runs: false
  old_world_model_allowed_for_formal_runs: false

ug_cem_runtime:
  normalizer_bundle: outputs/ug_cem_v2/step6/ug_normalizers_online.pt
  normalizer_report: outputs/ug_cem_v2/step6/ug_normalizers_online_report.json
  normalizer_source_split: calibration
  normalizer_calibration_seeds: [3000, 3001, 3002, 3003, 3004, 3005, 3006, 3007]
  normalizer_calls_per_agent: 100
  normalizer_online_updates_after_warmup: false
