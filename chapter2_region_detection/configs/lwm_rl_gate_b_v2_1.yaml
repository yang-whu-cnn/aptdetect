config:
  name: lwm_rl_gate_b_v2_1
  version: "2.3"
  status: gate_b_b4_pre_smoke_registry_driven
  source_of_truth: docs/FINAL_PAPER_EXPERIMENT_ALIGNMENT.md
  historical_plan: docs/UG_CEM_APT_REPRODUCTION_PLAN.md
  protocol_amendment: docs/gate-b-B4-pre-smoke-design-audit.md

shared_contract:
  state_dim: 27
  n_actions: 4
  horizon: 4
  gamma_tick: 0.99
  actions:
    - no_op
    - analyse
    - remove
    - restore
  world_model: outputs/world_model_final_20260917/a4_5b/world_model_absolute.pt
  response_reward_predictor: outputs/world_model_final_20260917/a4_5c/response_reward_predictor.pt
  response_objective:
    reward_protocol: final_paper_20260917_v1
    lambda_time: 1.0
    lambda_failure: 1.0
    delay_term: sum_active_incident_compromise_age
    failure_scope: all_tracked_host_local_work_failures
    early_warning_lead_reward: false
    fixed_action_cost: false

llm_prior:
  mode: registry_driven_multi_model
  model_registry: configs/llm_model_registry_v1.yaml
  primary_model_selected: false
  gateway_base_url: https://api.ofox.ai/v1
  api_key_env: OFOX_API_KEY
  generation_temperature: 0.2
  k_candidates: 6
  plan_horizon: 4
  prompt_version: lwm_rl_gate_b_v2_1
  prompt_context:
    formal_state: planner_visible_d27
    public_agent_identifier: true
    hidden_truth: false
  cache_identity:
    exact_d27_float32: true
    model_registry_identity: true
    prompt_version: true
    generation_config: true
    split: true
    public_agent_identifier: true
  host_target_selection: false
  output_format: strict_json_schema
  parser:
    candidate_key: candidates
    action_key: actions
    prior_score_key: prior_score
    valid_action_names: [no_op, analyse, remove, restore]
    exact_plan_length_required: true
    prior_score_range: [0.0, 1.0]
    reject_unknown_actions: true
  duplicate_handling:
    exact_plan_dedup: true
    keep: highest_prior_score
  fallback:
    strategy: deterministic_uniform_plan_space_sample
    seed: 20260916
    state_dependent: false
    hidden_truth_dependent: false
    fallback_raw_prior_score: 0.0

posterior_observation:
  selector_action: candidate_plan_index
  candidate_count: 6
  state_dim: 27
  plan_encoding: categorical_one_hot
  plan_one_hot_dim: 16
  prior_dim: 1
  value_dim: 1
  uncertainty_dim: 1
  candidate_feature_dim: 46
  components:
    - current_state
    - candidate_plan
    - llm_prior_preference
    - predicted_value
    - predictive_uncertainty
  predicted_value: ensemble_member_cumulative_response_return_mean
  predictive_uncertainty: ensemble_member_cumulative_response_return_population_std
  action_cost_evidence: false
  checkpoint_coverage_evidence: false
  delay_evidence: false
  early_warning_evidence: false

ppo_pretrain_contract:
  old_checkpoints_legacy: true
  candidate_count: 6
  formal_action_space: 4
  candidate_feature_dim: 46
  candidate_encoder_hidden: [128, 128]
  actor_head: shared_scalar_per_candidate
  critic_pool: mean
  critic_hidden: 128
  permutation_equivariant_actor: true
  permutation_invariant_critic: true
  orthogonal_initialization: true
  actor_output_gain: 0.01
  critic_output_gain: 1.0
  learning_rate: 0.0003
  rollout_length: 128
  update_epochs: 5
  minibatch_size: 64
  clip_epsilon: 0.2
  gae_lambda: 0.95
  entropy_coefficient: 0.01
  value_coefficient: 0.5
  max_grad_norm: 0.5
  advantage_normalization: true
  gamma_tick: 0.99
  duration_aware_discount: true
  duration_gae_rule: gamma_tick_power_dt_times_lambda_per_decision
  reward_source: real_cc4_accumulated_response_reward_only
  wm_predicted_value_is_reward_target: false
  provisional_policy_variants:
    - llm_h_gpt56_sol
    - llm_m_gpt54_mini
    - llm_l_gemini35_flash_lite
  provisional_max_decision_transitions_per_variant: 20000
  provisional_weights_formal_eligible: false
  formal_max_decision_transitions: 100000
  checkpoint_interval: 10000
  minimum_training_seeds_per_model: 3
  train_seeds:
    - 1000
    - 1001
    - 1002
    - 1003
    - 1004
    - 1005
    - 1006
    - 1007
    - 1008
    - 1009
    - 1010
    - 1011
    - 1012
    - 1013
    - 1014
    - 1015
    - 1016
    - 1017
    - 1018
    - 1019
    - 1020
    - 1021
    - 1022
    - 1023
    - 1024
    - 1025
    - 1026
    - 1027
    - 1028
    - 1029
    - 1030
    - 1031
  validation_seeds: [2000, 2001, 2002, 2003, 2004, 2005, 2006, 2007]
  calibration_test_forbidden: true
  b4_network_and_training_details: frozen_v2_3

b0_2_ood_contract:
  evaluate_all_formal_llm_variants: true
  reference_distribution: frozen_train_validation_replay
  knn_k: 5
  validation_to_train_percentile: 99
  max_ood_fraction: 0.10
  max_probe_to_validation_rmse_ratio: 1.25
  uncertainty_error_spearman_must_be_positive: true
  top_uncertainty_quartile_error_must_exceed_bottom: true
  all_a4_actions_must_have_coverage: true
  train_only: true
  no_test_or_calibration: true

legacy_isolation:
  src_llm_prior_allowed: false
  src_ppo_posterior_allowed: false
  src_plan_eval_allowed: false
  src_env_region_allowed: false
  old_a5_checkpoint_allowed: false
  gemini_prior_client_formal_allowed: false
